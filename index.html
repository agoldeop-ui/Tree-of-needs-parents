<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tree of Needs — Unified Parent Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E14;--card:#111A24;--field:#0d141c;--gold:#F2A65A;--gl:#FFCF96;--cy:#00E5FF;--warn:#E08A9A;--ink:#E6EEF5;--mute:#7A8D9C;--line:#1F2C3A;--on:#000;
    --c-roots:#6B7F94;--c-trunk:#5B8FB9;--c-branches:#4A9DB8;--c-leaves:#7BA8C4;--c-fruits:#7A6B9C;
    --c-healthy:#5B8FB9;--c-moderate:#C68B4A;--c-strained:#B85C6B;
    --radius:14px;--radius-sm:10px;--radius-xs:8px;
    color-scheme:dark;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 'Public Sans',system-ui,sans-serif;min-height:100dvh}
  
  .app{display:flex;min-height:100dvh}
  .sidebar{width:260px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:24px 0;position:fixed;top:0;bottom:0;left:0;z-index:100;display:flex;flex-direction:column;transition:transform 0.3s}
  .sidebar-brand{padding:0 24px 24px;display:flex;align-items:center;gap:10px}
  .sidebar-brand span{font-family:'Fraunces',serif;font-weight:700;font-size:1.2rem;color:var(--gl)}
  .nav{flex:1;padding:0 12px;overflow-y:auto}
  .nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);font-size:.95rem;font-weight:500;color:var(--mute);transition:all 0.2s;cursor:pointer;width:100%;text-align:left;background:none;border:none}
  .nav-item:hover{background:var(--bg);color:var(--ink)}
  .nav-item.active{background:var(--gold);color:#000;font-weight:600}
  .nav-icon{width:20px;height:20px;opacity:.7;flex-shrink:0}
  .nav-item.active .nav-icon{opacity:1}
  
  .main{flex:1;margin-left:260px;padding:32px 40px 80px;max-width:100%;display:flex;flex-direction:column}
  .mobile-header{display:none;align-items:center;gap:12px;margin-bottom:24px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);position:sticky;top:0;z-index:50}
  .mobile-header button{padding:8px;border-radius:var(--radius-xs);background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;color:var(--ink)}
  
  @media(max-width:900px){
    .sidebar{transform:translateX(-100%);box-shadow:0 12px 40px rgba(0,0,0,.5)}
    .sidebar.open{transform:translateX(0)}
    .main{margin-left:0;padding:20px 16px 60px}
    .mobile-header{display:flex}
  }

  .page{display:none;flex:1}
  .page.active{display:block}
  
  h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;line-height:1.2}
  h1{color:var(--gl);font-size:2rem;margin-bottom:8px}
  p{max-width:72ch;color:var(--ink)}
  .sub{color:var(--mute);font-size:.95rem;margin-bottom:16px}

  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:var(--radius-sm);font-size:.95rem;font-weight:600;transition:all 0.2s;min-height:44px;border:1.5px solid transparent;cursor:pointer;font-family:inherit}
  .btn-primary{background:var(--gold);color:#000}
  .btn-primary:hover{opacity:.9;transform:translateY(-1px)}
  .btn-outline{border-color:var(--line);color:var(--ink);background:var(--card)}
  .btn-outline:hover{border-color:var(--gold);color:var(--gold)}
  .btn-ghost{color:var(--mute);background:none}
  .btn-ghost:hover{color:var(--ink)}
  .btn-small{padding:8px 14px;font-size:.82rem;min-height:36px}
  .btn:disabled{opacity:.4;pointer-events:none}

  .today-hero{text-align:center;margin-bottom:32px}
  .today-hero p{color:var(--mute);font-size:1.05rem;margin:0 auto;max-width:480px}

  /* Landing / Onboarding */
  .onboarding{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;max-width:520px;margin:0 auto}
  .onboarding h1{font-size:2.2rem;margin-bottom:16px}
  .onboarding p{font-size:1.1rem;color:var(--mute);margin-bottom:24px;line-height:1.7}
  .onboarding .btn{width:100%;justify-content:center;padding:16px;margin-bottom:12px}
  .step-indicator{display:flex;gap:8px;margin-bottom:32px}
  .step-dot{width:10px;height:10px;border-radius:50%;background:var(--line);transition:all 0.2s}
  .step-dot.active{background:var(--gold);transform:scale(1.2)}
  
  /* Context */
  .context-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto}
  .context-card{padding:22px 18px;border-radius:var(--radius);border:2px solid var(--line);background:var(--card);cursor:pointer;transition:all 0.2s;text-align:center}
  .context-card:hover{border-color:var(--gold);transform:translateY(-2px)}
  .context-card .cc-icon{font-size:2rem;margin-bottom:8px;color:var(--gold)}
  .context-card .cc-title{font-family:'Fraunces',serif;font-weight:700;font-size:1.1rem}
  .context-card .cc-desc{font-size:.8rem;color:var(--mute);margin-top:4px}

  /* Diagnostic */
  .diag-progress{height:6px;background:var(--line);border-radius:3px;margin-bottom:32px;overflow:hidden;max-width:600px;margin-left:auto;margin-right:auto}
  .diag-bar{height:100%;background:var(--gold);width:0;transition:width .4s ease}
  .diag-q{max-width:600px;margin:0 auto;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:32px 28px}
  .diag-q .q-layer{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:12px}
  .diag-q .q-text{font-family:'Fraunces',serif;font-size:1.3rem;margin-bottom:24px;line-height:1.4}
  .diag-scale{display:flex;gap:8px}
  .diag-scale button{flex:1;min-width:50px;padding:14px 8px;border:2px solid var(--line);border-radius:var(--radius-sm);font-size:.9rem;background:var(--bg);transition:all 0.2s;min-height:56px;color:var(--ink);cursor:pointer}
  .diag-scale button:hover{border-color:var(--gold)}
  .diag-scale button.sel{background:var(--gold);color:#000;border-color:var(--gold)}
  .diag-scale .lab{display:block;font-size:.7rem;margin-top:4px;opacity:.7}

  /* Results / Tree Map */
  .results-container{max-width:720px;margin:0 auto}
  .tree-state{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);overflow:hidden;margin-bottom:20px}
  .ts-row{border-bottom:1px solid var(--line);cursor:pointer;transition:background 0.2s}
  .ts-row:hover{background:rgba(255,255,255,0.02)}
  .ts-line{display:flex;align-items:center;gap:10px;padding:14px 16px}
  .ts-name{font-family:'Fraunces',serif;font-weight:700;font-size:1rem;flex:0 0 auto;min-width:80px}
  .ts-score{font-size:.8rem;color:var(--mute);flex:0 0 auto;min-width:90px;text-align:right;margin-left:auto}
  .ts-track{width:60px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex-shrink:0}
  .ts-fill{display:block;height:100%;border-radius:3px}
  .ts-panel{padding:16px;border-top:1px dashed var(--line);background:var(--bg)}
  
  .layer-bar-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:10px}
  .lbi-info{flex:1}
  .lbi-name{font-family:'Fraunces',serif;font-weight:700;font-size:1rem;margin-bottom:2px}
  .lbi-score{font-size:.8rem;color:var(--mute)}
  .lbi-track{width:100px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .lbi-fill{height:100%;border-radius:4px}

  /* Cards / Chips */
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  .chip{padding:8px 14px;border-radius:20px;background:var(--bg);border:1px solid var(--line);font-size:.9rem;cursor:pointer;transition:all 0.2s}
  .chip:hover{border-color:var(--gold)}
  .chip.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:600}
  
  /* Dark Needs / Games */
  .game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:32px}
  .game-card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:22px;transition:all 0.2s;display:flex;flex-direction:column;gap:10px}
  .game-card.live{cursor:pointer}
  .game-card.live:hover{border-color:var(--gold);transform:translateY(-2px)}
  .gc-title{font-family:'Fraunces',serif;font-weight:700;font-size:1.2rem}
  .gc-pitch{font-size:.9rem;color:var(--mute);line-height:1.5;flex:1}
  
  .flinch-card{border:1px solid var(--warn);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;background:rgba(224,138,154,0.05)}
  .flinch-card h3{color:var(--warn);font-size:1.1rem;margin-bottom:4px}
  .flinch-card .shadow{color:var(--warn);font-size:.85rem;margin-bottom:6px}
  .flinch-card .integrated{color:var(--cy);font-size:.85rem}

  /* Inputs */
  input,textarea,select{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit;margin-bottom:12px}
  textarea{min-height:100px;resize:vertical;font-family:'Fraunces',serif;font-size:1.05rem}
  label{display:block;font-size:.75rem;color:var(--gold);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.06em}
  
  /* Utility */
  .action-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  .hide{display:none !important}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span>Needs Tree</span>
    </div>
    <nav class="nav">
      <button class="nav-item" data-page="landing"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</button>
      <button class="nav-item" data-page="today"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>Today</button>
      <button class="nav-item" data-page="diagnostic"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>Parent Quiz</button>
      <button class="nav-item" data-page="dark"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8 2 5 5 5 9c0 2 1 4 3 5-2 1-3 3-3 5v3h14v-3c0-2-1-4-3-5 2-1 3-3 3-5 0-4-3-7-7-7z"/></svg>Dark needs</button>
      <button class="nav-item" data-page="play"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>Play</button>
      <button class="nav-item" data-page="tree"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8 2 5 5 5 9c0 2 1 4 3 5-2 1-3 3-3 5v3h14v-3c0-2-1-4-3-5 2-1 3-3 3-5 0-4-3-7-7-7z"/></svg>My Tree</button>
      <button class="nav-item" data-page="journal"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2zM22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>Journal</button>
    </nav>
  </aside>

  <div class="main">
    <div class="mobile-header">
      <button id="menuBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
      <span>Needs Tree</span>
    </div>

    <!-- PAGES -->
    <div class="page active" id="page-landing"><div id="landingContent"></div></div>
    <div class="page" id="page-context">
      <div class="today-hero"><h1>Who is taking this today?</h1><p>This tailors the language and the needs we surface.</p></div>
      <div class="context-grid" id="contextGrid"></div>
    </div>
    <div class="page" id="page-today"><div id="todayBody"></div></div>
    <div class="page" id="page-diagnostic"><div id="diagContent"></div></div>
    <div class="page" id="page-dark"><div id="darkBody"></div></div>
    <div class="page" id="page-play"><div id="playContent"></div></div>
    <div class="page" id="page-tree"><div id="treeMapContainer"></div></div>
    <div class="page" id="page-journal"><div id="journalContent"></div></div>
  </div>
</div>

<script>
/* ============================================================
   DATA
   ============================================================ */
const LORDER = ["roots","trunk","branches","leaves","fruits"];
const L = {roots:"Roots", trunk:"Trunk", branches:"Branches", leaves:"Leaves", fruits:"Fruits"};
const Lcolor = {roots:"#6B7F94", trunk:"#5B8FB9", branches:"#4A9DB8", leaves:"#7BA8C4", fruits:"#7A6B9C"};
const Ldesc = {
  roots:"Essential needs — what makes life livable",
  trunk:"Core identity and cognitive structure",
  branches:"Relational and emotional needs",
  leaves:"Production, play, and regeneration",
  fruits:"Contribution, meaning, and purpose"
};

/* THE EXACT PARENT QUESTIONS REQUESTED */
const PARENT_QUIZ = [
  { layer: "roots", text: "I'm so focused on my child's needs that I've stopped meeting my own." },
  { layer: "roots", text: "Our home or routine feels chaotic — I can't get a stable footing." },
  { layer: "roots", text: "I'm exhausted in a way that sleep doesn't fix." },
  { layer: "trunk", text: "I've become 'mum' or 'dad' and lost the rest of who I am." },
  { layer: "trunk", text: "I can't set a boundary with my child without feeling like a bad parent." },
  { layer: "trunk", text: "I hide my own needs and feelings from my family." },
  { layer: "branches", text: "I feel isolated — other parents don't seem to struggle the way I do." },
  { layer: "branches", text: "I don't feel supported by my partner, my family, or my community." },
  { layer: "branches", text: "I give endlessly and receive very little." },
  { layer: "leaves", text: "I can't remember the last thing I did for myself." },
  { layer: "leaves", text: "I feel like a machine that produces care." },
  { layer: "leaves", text: "Rest feels impossible — there's always something." },
  { layer: "fruits", text: "I'm so in the daily grind I've lost sight of the bigger picture." },
  { layer: "fruits", text: "I don't feel like the parent I wanted to be." },
  { layer: "fruits", text: "I can't connect to the meaning of this season." }
];

const DARK_NEEDS = [
  { id: "control", title: "Control", desc: "The need to know what happens next.", shadow: "You micromanage. It calms you for an hour.", integrated: "Make two columns: what I can change today, and what I can't." },
  { id: "attention", title: "Attention", desc: "The need for someone to register you exist.", shadow: "You post provocatively or go silent hoping someone notices.", integrated: "Say it plainly: 'I need twenty minutes of your attention.'" },
  { id: "anger", title: "Anger", desc: "The need to push back. Anger shows where your limits are.", shadow: "You snap at a dirty dishwasher or swallow it until you get headaches.", integrated: "Name it early: 'I'm getting annoyed. I need a minute.'" }
];

/* ============================================================
   STATE MANAGEMENT
   ============================================================ */
const STORAGE_KEY = "needsTree.parentQuiz.v1";

let state = {
  diagAnswers: new Array(15).fill(null),
  diagCurrent: 0,
  diagScores: null,
  diagStrained: null,
  emergencyPicks: {roots:[],trunk:[],branches:[],leaves:[],fruits:[]},
  treeNeeds: {roots:[],trunk:[],branches:[],leaves:[],fruits:[]},
};

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) {
      const parsed = JSON.parse(raw);
      Object.keys(parsed).forEach(k => { if(k in state) state[k] = parsed[k]; });
    }
  } catch(e) {}
}

/* ============================================================
   HELPERS & NAVIGATION
   ============================================================ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function navigateTo(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('page-' + pageId);
  if(target) target.classList.add('active');
  
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === pageId));
  document.getElementById('sidebar').classList.remove('open');
  
  if(pageId === 'landing') renderLanding();
  if(pageId === 'diagnostic') renderDiagnostic();
  if(pageId === 'today') renderToday();
  if(pageId === 'tree') renderTree();
  if(pageId === 'dark') renderDark();
  if(pageId === 'play') renderPlay();
  if(pageId === 'journal') renderJournal();
  
  window.scrollTo(0,0);
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => navigateTo(btn.dataset.page));
});
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

/* ============================================================
   LANDING
   ============================================================ */
function renderLanding() {
  document.getElementById('landingContent').innerHTML = `
    <div style="text-align:center;padding:40px 0">
      <h1>Find out which part of your life is starving.</h1>
      <p class="sub" style="max-width:480px;margin:0 auto 24px">Answer 15 statements about parenting. Get a map of your needs.</p>
      <button class="btn btn-primary" onclick="startQuiz()">Start the 15 statements</button>
    </div>
  `;
}

function startQuiz() {
  state.diagCurrent = 0;
  state.diagAnswers = new Array(15).fill(null);
  state.diagScores = null;
  saveState();
  navigateTo('diagnostic');
}

/* ============================================================
   DIAGNOSTIC (PARENT QUIZ)
   ============================================================ */
function renderDiagnostic() {
  if(state.diagScores) {
    renderResults();
    return;
  }
  
  const c = document.getElementById('diagContent');
  
  if(state.diagCurrent >= PARENT_QUIZ.length) {
    computeDiagResult();
    return;
  }
  
  const q = PARENT_QUIZ[state.diagCurrent];
  const pct = (state.diagCurrent / PARENT_QUIZ.length) * 100;
  const labels = ["Not me","Rarely","Sometimes","Often","Very me"];
  
  c.innerHTML = `
    <div class="today-hero"><h1>The Parent Quiz</h1><p>Statement ${state.diagCurrent + 1} of 15.</p></div>
    <div class="diag-progress"><div class="diag-bar" style="width:${pct}%"></div></div>
    <div class="diag-q">
      <div class="q-layer">${L[q.layer]}</div>
      <div class="q-text">${esc(q.text)}</div>
      <div class="diag-scale">
        ${[0,1,2,3,4].map(v => `<button onclick="answerDiag(${v})">${v}<span class="lab">${labels[v]}</span></button>`).join('')}
      </div>
    </div>
  `;
}

function answerDiag(val) {
  state.diagAnswers[state.diagCurrent] = val;
  state.diagCurrent++;
  saveState();
  renderDiagnostic();
}

function computeDiagResult() {
  const scores = {roots:0, trunk:0, branches:0, leaves:0, fruits:0};
  PARENT_QUIZ.forEach((q,i) => {
    if(state.diagAnswers[i] !== null) scores[q.layer] += state.diagAnswers[i];
  });
  state.diagScores = scores;
  
  let max = -1;
  let strained = "roots";
  LORDER.forEach(l => {
    if(scores[l] > max) { max = scores[l]; strained = l; }
  });
  state.diagStrained = strained;
  
  saveState();
  renderDiagnostic();
}

/* ============================================================
   RESULTS / TREE MAP
   ============================================================ */
function renderResults() {
  const c = document.getElementById('diagContent');
  const scores = state.diagScores;
  
  c.innerHTML = `
    <div class="results-container">
      <div class="today-hero"><h1>Your Needs Tree</h1><p>Based on your parent quiz answers.</p></div>
      <div class="tree-state">
        ${LORDER.slice().reverse().map(l => {
          const sc = scores[l];
          const st = sc <= 3 ? "healthy" : sc <= 7 ? "moderate" : "strained";
          const pct = Math.min(100, (sc/12)*100);
          return `
            <div class="ts-row">
              <div class="ts-line">
                <span class="ts-name" style="color:${Lcolor[l]}">${L[l]}</span>
                <span class="ts-score">${sc}/12 · ${st}</span>
                <span class="ts-track"><span class="ts-fill" style="width:${pct}%;background:${Lcolor[l]}"></span></span>
              </div>
            </div>
          `;
        }).join('')}
      </div>
      <div class="action-row">
        <button class="btn btn-primary" onclick="navigateTo('tree')">See My Tree →</button>
        <button class="btn btn-outline" onclick="startQuiz()">Retake Quiz</button>
      </div>
    </div>
  `;
}

function renderTree() {
  const c = document.getElementById('treeMapContainer');
  
  c.innerHTML = `
    <div class="today-hero"><h1>Your Personal Tree</h1><p>Mark what's missing, not what you have.</p></div>
    <div class="results-container">
      ${LORDER.slice().reverse().map(l => {
        const needs = state.treeNeeds[l] || [];
        return `
          <div style="border:2px solid ${Lcolor[l]};border-radius:12px;padding:16px;margin-bottom:12px;background:var(--card)">
            <h4 style="color:${Lcolor[l]};margin-bottom:8px">${L[l]} <span style="color:var(--mute);font-size:.85rem;font-weight:400">(${Ldesc[l]})</span></h4>
            <div class="chip-grid">
              ${needs.length ? needs.map(n => `<span class="chip on" style="background:${Lcolor[l]};border-color:${Lcolor[l]};color:#fff">${esc(n)}</span>`).join('') : `<span style="color:var(--mute);font-size:.9rem;font-style:italic">No needs added yet.</span>`}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

/* ============================================================
   DARK NEEDS, PLAY, TODAY, JOURNAL
   ============================================================ */
function renderDark() {
  const c = document.getElementById('darkBody');
  c.innerHTML = `
    <div class="today-hero"><h1>The needs you were taught to hide.</h1><p>They're not flaws. They're needs that went underground and came out sideways.</p></div>
    <div class="results-container">
      ${DARK_NEEDS.map(dn => `
        <div class="flinch-card">
          <h3>${dn.title}</h3>
          <p style="font-size:.9rem;color:var(--mute);margin-bottom:8px">${dn.desc}</p>
          <div class="shadow"><strong>Shadow:</strong> ${dn.shadow}</div>
          <div class="integrated"><strong>Integrated:</strong> ${dn.integrated}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderPlay() {
  const c = document.getElementById('playContent');
  c.innerHTML = `
    <div class="today-hero"><h1>Play</h1><p>These are the games that made the deck.</p></div>
    <div class="game-grid">
      <div class="game-card live" onclick="alert('Sort it: Deal 15 cards into categories.')">
        <div class="gc-title">Sort it</div>
        <div class="gc-pitch">Deal 15 cards at random. Sort them into categories. Only three may be emergencies.</div>
        <div style="color:var(--gold);font-weight:600">Start →</div>
      </div>
      <div class="game-card live" onclick="alert('Say it out loud: I need ___.')">
        <div class="gc-title">Say it out loud</div>
        <div class="gc-pitch">Draw one card. Say to them: I need ___, and what I usually do instead is ___.</div>
        <div style="color:var(--gold);font-weight:600">Start →</div>
      </div>
    </div>
  `;
}

function renderToday() {
  const c = document.getElementById('todayBody');
  if(!state.diagScores) {
    c.innerHTML = `<div class="today-hero"><h1>Start with the diagnostic</h1><p>Fifteen statements. Two minutes.</p><button class="btn btn-primary" onclick="startQuiz()">Take the quiz</button></div>`;
    return;
  }
  
  c.innerHTML = `
    <div class="today-hero"><h1>What layer needs feeding today?</h1><p>Your Needs Tree is a map of what sustains you.</p></div>
    <div class="results-container">
      <div class="action-row" style="justify-content:flex-start;margin-bottom:24px">
        <button class="btn btn-primary" onclick="navigateTo('tree')">Open My Tree</button>
      </div>
      <div class="layer-bars">
        ${LORDER.slice().reverse().map(l => {
          const sc = state.diagScores[l] || 0;
          const pct = Math.min(100, (sc/12)*100);
          return `
            <div class="layer-bar-item">
              <div class="lbi-info">
                <div class="lbi-name" style="color:${Lcolor[l]}">${L[l]}</div>
                <div class="lbi-score">${sc}/12</div>
              </div>
              <div class="lbi-track"><div class="lbi-fill" style="width:${pct}%;background:${Lcolor[l]}"></div></div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderJournal() {
  const c = document.getElementById('journalContent');
  c.innerHTML = `
    <div class="today-hero"><h1>Your Reflections</h1><p>Write what it stirs. Come back to see what shifts.</p></div>
    <div style="max-width:600px;margin:0 auto">
      <div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px">
        <textarea placeholder="Write your reflection..."></textarea>
        <button class="btn btn-primary" onclick="alert('Saved to journal')">Save reflection</button>
      </div>
    </div>
  `;
}

/* ============================================================
   INIT
   ============================================================ */
loadState();
navigateTo('landing');

</script>
</body>
</html>
